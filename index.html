<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>
<style>
body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
.calculator { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
input { width: 200px; height: 40px; font-size: 24px; text-align: right; margin-bottom: 10px; display: block; }
button { width: 50px; height: 50px; font-size: 20px; cursor: pointer; margin: 2px; }
.btn-orange { background: orange; color: white; }
.btn-green { background: green; color: white; }
.btn-red { background: red; color: white; }
</style>
</head>
<body>

<div class="calculator">
<input type="text" id="result" readonly>
<button class="btn-red" onclick="clearResult()">C</button>
<button onclick="addToResult('/')">/</button>
<button onclick="addToResult('*')">×</button>
<button onclick="addToResult('-')">−</button><br>
<button onclick="addToResult('7')">7</button>
<button onclick="addToResult('8')">8</button>
<button onclick="addToResult('9')">9</button>
<button onclick="addToResult('+')">+</button><br>
<button onclick="addToResult('4')">4</button>
<button onclick="addToResult('5')">5</button>
<button onclick="addToResult('6')">6</button>
<button onclick="addToResult('.')">.</button><br>
<button onclick="addToResult('1')">1</button>
<button onclick="addToResult('2')">2</button>
<button onclick="addToResult('3')">3</button>
<button class="btn-green" onclick="calculate()">=</button><br>
<button onclick="addToResult('0')" style="width:104px">0</button>

<script>
function addToResult(value) { document.getElementById("result").value += value; }
function clearResult() { document.getElementById("result").value = ""; }
function calculate() {
try { document.getElementById("result").value = eval(document.getElementById("result").value); }
catch { document.getElementById("result").value = "Error"; }
}
</script>

</body>
</html>
